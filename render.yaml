services:
  - type: web
    name: linkding
    runtime: docker
    # Render always builds the last stage in a Dockerfile and has no
    # equivalent of `docker build --target`, so this uses a trimmed
    # Dockerfile that stops at the plain `linkding` stage instead of
    # docker/default.Dockerfile, which also builds the extra `linkding-plus`
    # (Chromium/snapshot) stage that isn't needed here.
    dockerfilePath: docker/deploy.Dockerfile
    dockerContext: .
    # Free plan: no persistent disk available, so the data folder (favicons,
    # preview images, HTML snapshots) is ephemeral and reset on every restart
    # or redeploy. Bookmark data itself is unaffected since it lives in D1.
    # Upgrade to a paid plan and add a `disk:` block back if you need those
    # local files to persist too.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LD_DB_ENGINE
        value: d1
      - key: LD_CF_ACCOUNT_ID
        sync: false
      - key: LD_CF_D1_DATABASE_ID
        sync: false
      - key: LD_CF_API_TOKEN
        sync: false
      - key: LD_SUPERUSER_NAME
        sync: false
      - key: LD_SUPERUSER_PASSWORD
        sync: false
