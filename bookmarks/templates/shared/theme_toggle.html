{# Which button is visible is decided by the active theme stylesheet, so that this also works with the auto theme #}
<form class="theme-toggle d-inline"
      action="{% url 'linkding:settings.theme' %}"
      method="post"
      data-turbo="false">
  {% csrf_token %}
  <input type="hidden" name="return_url" value="{{ request.get_full_path }}">
  <button type="submit"
          name="theme"
          value="dark"
          class="btn btn-link theme-toggle-to-dark"
          title="Switch to dark theme"
          aria-label="Switch to dark theme">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
  </button>
  <button type="submit"
          name="theme"
          value="light"
          class="btn btn-link theme-toggle-to-light"
          title="Switch to light theme"
          aria-label="Switch to light theme">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
  </button>
</form>
